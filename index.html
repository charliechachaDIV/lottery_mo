<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>社區消費大獎賞2026 核銷小助手</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #003087;
      --accent: #0066cc;
      --danger: #d32f2f;
      --gray: #666666;
      --light-gray: #f0f0f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #1f2937;
      touch-action: manipulation;
    }
    nav {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 0 10px;
    }
    .nav-logo { height: 28px; width: auto; margin-right: 15px; }
    nav button {
      flex: 1;
      padding: 15px 8px;
      border: none;
      background: none;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    nav button.active {
      color: var(--primary);
      border-bottom: 4px solid var(--primary);
    }
    .container { padding: 12px; max-width: 620px; margin: auto; }
    .page { display: none; }
    .page.active { display: block; }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 18px;
      border: 1px solid #e5e7eb;
    }
    .app-row { padding: 14px 0; border-bottom: 1px solid #e5e7eb; }
    .app-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .app-name { font-size: 1.15rem; font-weight: 700; }
    .voucher-slots { display: flex; gap: 10px; margin-bottom: 12px; }
    .slot {
      flex: 1; height: 56px; border: 2px solid #d1d5db; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem; font-weight: 700; background: #fff;
      position: relative;
    }
    .slot.filled { border-color: var(--primary); background: #e3f0ff; color: var(--primary); }
    .slot.filled::after {
      content: '×'; position: absolute; top: -6px; right: -6px;
      background: var(--danger); color: white; width: 22px; height: 22px;
      border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center;
    }
    .chip {
      padding: 12px 8px; border: 1px solid #d1d5db; background: white;
      border-radius: 8px; font-size: 1.05rem; font-weight: 600;
      cursor: pointer; flex: 1; text-align: center;
    }
    .total-summary {
      background: var(--primary); color: white; border-radius: 12px;
      padding: 16px; margin-bottom: 16px; text-align: center;
    }
    .total-amount { font-size: 2.35rem; font-weight: 800; }
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dash-item {
      background: white; padding: 14px; border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 1px solid #e5e7eb;
    }
    .v-amount { font-size: 1.8rem; font-weight: 700; color: #d32f2f; }
    .s-amount { font-size: 0.95rem; color: #0066cc; margin-top: 4px; }

    .mini-slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .mini-slot {
      flex: 0 0 calc(33.33% - 6px);
      height: 52px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #003087;
      color: white;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .mini-slot.used {
      background: #f0f0f0;
      color: #666666;
      border-color: #d1d5db;
      text-decoration: line-through 3px;
    }
    .btn-save {
      width: 100%; padding: 16px; background: var(--primary); color: white;
      border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; margin-top: 8px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="https://www.charliechacha.com/" target="_parent">
      <img src="https://www.charliechacha.com/wp-content/uploads/pages/logoword.png" alt="YieldSpot" style="height:28px;margin-right:15px;">
    </a>
    <button id="nav-input" onclick="showPage('input')">🎁 登記獎券</button>
    <button id="nav-dash" onclick="showPage('dash')">🧮 核銷看板</button>
    <button id="nav-stats" onclick="showPage('stats')" style="display:none;">📊 核銷統計</button>
  </nav>

  <div class="container">
    <div id="page-input" class="page">
      <div class="card">
        <h2>本期獎券登記 <small id="today-hint"></small></h2>
        <div id="input-list"></div>
        <button class="btn-save" onclick="saveData()">儲存這期獎券</button>
      </div>
    </div>

    <div id="page-dash" class="page">
      <div class="card">
        <h2>即時核銷看板（點擊格子扣除）</h2>
        <div class="total-summary">
          <h3>本期總獎券</h3>
          <div class="total-amount" id="grand-total">$0</div>
          <div>需消費 <span id="grand-spend">$0</span></div>
        </div>
        <div class="dashboard" id="dashboard-grid"></div>
      </div>
    </div>

    <div id="page-stats" class="page">
      <div class="card">
        <h2>歷史獎券統計</h2>
        <div id="stats-container"></div>
      </div>
    </div>

    <div id="user-info" class="status">載入中...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://najwaxbrovbzjqomakqh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SjL1VX7VoFzEX5tcYnMKsA_eE05FkNS';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const apps = ['澳門中銀', '工銀e支付', 'MPay', '豐付寶', '支付寶(澳門)', 'UePay', 'LusoPay', '廣發支付'];
    const denominations = [10, 20, 50, 100, 200];

    let myToken = localStorage.getItem('lottery_token') || 'user_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('lottery_token', myToken);

    let selection = {};

    function getMacauPeriodTag() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const macau = new Date(utc + 8*3600000);
      macau.setHours(0,0,0,0);
      const day = macau.getDay();
      const daysToSubtract = (day - 5 + 7) % 7;
      macau.setDate(macau.getDate() - daysToSubtract);
      return `${macau.getFullYear()}-${String(macau.getMonth()+1).padStart(2,'0')}-${String(macau.getDate()).padStart(2,'0')}`;
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;background:#0066cc;color:white;border-radius:8px;z-index:9999;`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1600);
    }

    // 初始化輸入頁
    const inputList = document.getElementById('input-list');
    apps.forEach(app => {
      selection[app] = [];
      inputList.innerHTML += `
        <div class="app-row">
          <div class="app-info"><span class="app-name">${app}</span><span id="total-${app}" style="color:var(--primary);font-weight:bold;">$0</span></div>
          <div class="voucher-slots" id="slots-${app}"></div>
          <div class="btn-group">${denominations.map(d => `<button class="chip" onclick="addVoucher('${app}', ${d})">${d}</button>`).join('')}</div>
        </div>`;
      renderInputSlots(app);
    });

    function renderInputSlots(app) {
      const container = document.getElementById(`slots-${app}`);
      container.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const item = selection[app][i];
        const slot = document.createElement('div');
        slot.className = `slot ${item ? 'filled' : ''}`;
        slot.innerHTML = item ? `$${item.val}` : '';
        if (item) slot.onclick = () => { selection[app].splice(i, 1); renderInputSlots(app); };
        container.appendChild(slot);
      }
      document.getElementById(`total-${app}`).innerText = `$${selection[app].reduce((a,b)=>a+b.val,0)}`;
    }

    function addVoucher(app, val) {
      if (selection[app].length < 3) {
        selection[app].push({val, used: false});
        renderInputSlots(app);
      }
    }

    function renderDashCard(app) {
      const container = document.getElementById(`mini-${app}`);
      if (!container) return;
      container.innerHTML = '';

      const activeTotal = selection[app].filter(v => !v.used).reduce((a,b)=>a+b.val,0);
      const vEl = document.getElementById(`v-${app}`);
      const sEl = document.getElementById(`s-${app}`);
      if (vEl) vEl.innerText = `$${activeTotal}`;
      if (sEl) sEl.innerText = `$${(activeTotal*3)}`;

      selection[app].forEach((item, index) => {
        const mini = document.createElement('div');
        mini.className = `mini-slot ${item.used ? 'used' : ''}`;
        mini.innerText = `$${item.val}`;

        const handleClick = () => toggleUsed(app, index);
        mini.addEventListener('click', handleClick);
        mini.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handleClick();
        }, { passive: false });

        container.appendChild(mini);
      });
    }

    async function toggleUsed(app, slotIndex) {
      const item = selection[app][slotIndex];
      if (!item) return;

      const period = getMacauPeriodTag();
      const target = item.used ? 0 : 1;
      const old = item.used;
      item.used = !item.used;

      const { error } = await _supabase.from('lottery_records').update({ amount_paid: target })
        .eq('user_token', myToken)
        .eq('period_tag', period)
        .eq('payment_tool', app)
        .eq('slot_index', slotIndex);

      if (error) {
        item.used = old;
        showToast('核銷失敗，請稍後再試');
        return;
      }

      // 核銷後重新排序並渲染
      showPage('dash');
      showToast(item.used ? '✅ 已核銷' : '🔄 已取消核銷');
    }

    function updateGrandTotal() {
      let total = 0;
      apps.forEach(app => {
        const active = selection[app].filter(v => !v.used).reduce((a,b)=>a+b.val,0);
        total += active;
      });
      document.getElementById('grand-total').innerText = `$${total}`;
      document.getElementById('grand-spend').innerText = `$${(total*3)}`;
    }

    function showPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(`page-${pageName}`).classList.add('active');
      document.getElementById(`nav-${pageName}`).classList.add('active');

      if (pageName === 'dash') {
        const grid = document.getElementById('dashboard-grid');
        grid.innerHTML = '';

        // === 重點：排序邏輯 ===
        const sortedApps = [...apps].sort((a, b) => {
          const hasActiveA = selection[a].some(v => !v.used);
          const hasActiveB = selection[b].some(v => !v.used);
          if (hasActiveA && !hasActiveB) return -1;
          if (!hasActiveA && hasActiveB) return 1;
          return 0;
        });

        sortedApps.forEach(app => {
          grid.innerHTML += `
            <div class="dash-item" id="card-${app}">
              <div class="app-name" style="font-size:0.95rem">${app}</div>
              <span class="v-amount" id="v-${app}">$0</span>
              <div class="s-amount">需消費: <span id="s-${app}">$0</span></div>
              <div class="mini-slots" id="mini-${app}"></div>
            </div>`;
        });

        setTimeout(() => {
          sortedApps.forEach(app => renderDashCard(app));
          updateGrandTotal();
        }, 50);
      }
    }

    async function loadData() {
      const period = getMacauPeriodTag();
      const { data } = await _supabase.from('lottery_records')
        .select('*')
        .eq('user_token', myToken)
        .eq('period_tag', period);

      apps.forEach(app => selection[app] = []);

      (data || []).forEach(item => {
        if (!selection[item.payment_tool]) selection[item.payment_tool] = [];
        selection[item.payment_tool].push({
          val: item.reward,
          used: item.amount_paid === 1,
          slot_index: item.slot_index || 0
        });
      });

      apps.forEach(app => {
        selection[app].sort((a,b) => a.slot_index - b.slot_index);
        selection[app] = selection[app].slice(0,3);
        renderInputSlots(app);
      });

      document.getElementById('today-hint').innerHTML = `本期 <strong>${period}</strong>`;
    }

    async function saveData() {
      const btn = event.currentTarget;
      btn.innerText = "儲存中...";
      btn.disabled = true;

      const period = getMacauPeriodTag();
      await _supabase.from('lottery_records').delete().eq('user_token', myToken).eq('period_tag', period);

      const records = [];
      apps.forEach(app => {
        selection[app].forEach((item, i) => {
          records.push({
            user_token: myToken,
            payment_tool: app,
            reward: item.val,
            amount_paid: item.used ? 1 : 0,
            period_tag: period,
            slot_index: i
          });
        });
      });

      if (records.length > 0) await _supabase.from('lottery_records').insert(records);

      showToast('儲存成功');
      btn.innerText = "儲存這期獎券";
      btn.disabled = false;
      loadData();
    }

    // 啟動
    const day = new Date().getDay();
    if ([0,5,6].includes(day)) showPage('input');
    else showPage('dash');

    loadData();
  </script>
</body>
</html>
